name: release

on:
  workflow_run:
    workflows: ["check"]
    types: [completed]
  # CI listens only to branch pushes, so tags on tested tips need their own trigger.
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

# Serialize runs because annotated tag and commit SHAs cannot share a per-SHA race guard.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  # Gate outside the release environment so untagged CI runs never request it.
  gate:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Annotated tag pushes set github.sha to the tag object, not its commit.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      - name: Verify latest CI passed
        id: civerify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Dereference through any annotated tag to the tested commit.
          TARGET_SHA="$(git rev-parse 'HEAD^{commit}')"

          # A failed rerun must supersede an older success for the same commit.
          latest="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/workflows/check.yml/runs" \
            -f head_sha="${TARGET_SHA}" \
            -f event=push \
            -f per_page=100 \
            --jq '.workflow_runs | sort_by(.run_number) | last | [.status, (.conclusion // "")] | @tsv' 2>/dev/null || true)"

          if [ -z "${latest}" ]; then
            echo "::error::No check run found for commit ${TARGET_SHA}."
            exit 1
          fi

          IFS=$'\t' read -r ci_status ci_conclusion <<< "${latest}"
          if [ "${ci_status}" = "completed" ] && [ "${ci_conclusion}" = "success" ]; then
            echo "Latest check run for ${TARGET_SHA} passed."
            echo "approved=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A tag or older workflow_run arriving mid-CI is deferred to the latest successful workflow_run trigger.
          if [ "${ci_status}" != "completed" ] && [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]; then
            echo "CI for ${TARGET_SHA} is still running; deferring to the workflow_run trigger."
            exit 0
          fi

          echo "::error::Latest check run for ${TARGET_SHA} finished with ${ci_conclusion:-unknown}."
          exit 1

      - name: Check for release tag
        id: tag
        if: steps.civerify.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force
          TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -z "$TAG" ]; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "No vX.Y.Z tag points at this commit; skipping release."
            exit 0
          fi
          # Tag-push and workflow_run can both pass the gate for the same tag.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; skipping duplicate publish."
            exit 0
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

  release:
    needs: gate
    if: needs.gate.outputs.tag != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.tag }}
          fetch-depth: 0
      - name: Package and release
        uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0 # v2.6.1
