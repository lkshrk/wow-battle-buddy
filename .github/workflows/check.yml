name: check

on:
  push:
    branches: [main, r0-rematch-spec]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Lua 5.1 and luacheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends lua5.1 lua-check
      - name: Check
        run: scripts/check.sh

  package:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build archive
        run: scripts/package.sh "${GITHUB_SHA::12}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: BattleBuddy-${{ github.sha }}
          path: dist/BattleBuddy-*.zip
          if-no-files-found: error
          retention-days: 14
